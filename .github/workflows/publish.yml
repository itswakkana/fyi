name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release versions match tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Run CLI self-test
        run: node skills/fyi/scripts/selftest.mjs

      - name: Run Node test suites
        run: node --test skills/fyi/scripts/*.test.mjs skills/fyi/scripts/*-test.mjs

      - name: Check repository store health
        run: node skills/fyi/scripts/fyi.mjs doctor

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Configure NPM_TOKEN fallback if present
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Publish @itswakkana/fyi to npm
        run: npm publish --provenance --access public
